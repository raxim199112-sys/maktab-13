const show=(id,flex)=>{$(id).classList.remove('hidden');if(flex)$(id).classList.add('flex')};

function applyLang(){
  document.documentElement.lang=LC[L];document.title=t('sch');
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));

function doLogin(){
  if($('lg-user').value.trim()===LOGIN&&$('lg-pass').value===PASS){enter('admin')}

}

function enter(r){role=r;try{sessionStorage.setItem('m13_role',r)}catch(e){}hide('login');show('app',true);

function logout(){role=null;try{sessionStorage.removeItem('m13_role')}catch(e){}hide('app');$('lg-pass').value='';$('lg-err').classList.add('hidden');show('login',true)}

function card(x,big){
  const nm=esc(tr(x.name));
  return '<div class="bg-white rounded-3xl overflow-hidden shadow-md hover:shadow-xl border '+(big?'border-blue-200 shadow-xl':'border-slate-100')+' transition-shadow flex flex-col">'+
  '<div class="relative h-56 cursor-pointer overflow-hidden" data-open="'+x.id+'">'+
  '<img src="'+(x.img||avatar(tr(x.name),x.id+1))+'" alt="'+nm+'" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500">'+
  '<span class="absolute top-3 left-3 px-3 py-1 rounded-full bg-white/90 text-slate-700 text-xs font-bold">'+esc(catName(x.cat))+'</span></div>'+
  '<div class="p-5 flex-1 flex flex-col justify-between"><div><h3 class="font-bold text-slate-900 cursor-pointer hover:text-blue-600'+(big?' text-xl text-center':'')+'" data-open="'+x.id+'">'+nm+'</h3>'+
  '<p class="text-sm text-slate-500 mt-1'+(big?' text-center':'')+'">'+esc(tr(x.subject))+'</p></div>'+
  '<button data-open="'+x.id+'" class="mt-4 text-left text-sm font-semibold text-blue-600 hover:text-blue-700'+(big?' text-center w-full':'')+'">'+t('more')+'</button></div></div>';
}
function render(){
  const T=teachers(), dir=S.teachers.find(x=>x.dir);

  $('filters').innerHTML=['all',0,1,2,3].map(c=>'<button data-f="'+c+'" class="px-4 py-2 rounded-xl text-sm font-semibold border '+(String(c)===String(filter)?'bg-blue-600 text-white border-blue-600':'bg-white text-slate-600 border-slate-200 hover:bg-slate-100')+'">'+(c==='all'?t('all'):t('c'+c))+'</button>').join('');
  const list=filter==='all'?T:T.filter(x=>String(x.cat)===String(filter));
  $('grid').innerHTML=list.map(x=>card(x,false)).join('');
  $('dir-box').innerHTML=dir?card(dir,true):'';
}

function openView(id){
  const x=S.teachers.find(y=>y.id===id);if(!x)return;viewId=id;
  $('v-img').src=x.img||avatar(tr(x.name),x.id+1);
  $('v-cat').textContent=catName(x.cat);$('v-name').textContent=tr(x.name);$('v-subj').textContent=tr(x.subject);
  $('v-exp').textContent=tr(x.experience);$('v-deg').textContent=tr(x.degree);$('v-bio').textContent=tr(x.bio);
  $('v-ach').textContent=tr(x.achievements);$('v-phone').textContent=x.phone;
  $('v-admin').classList.toggle('hidden',!isAdmin());
  $('v-del').classList.toggle('hidden',!!x.dir);
  show('view',true);
}

function chStud(d){if(!isAdmin())return;S.students=Math.max(0,S.students+d);save();render()}
function setStud(){if(!isAdmin())return;const n=parseInt($('st-input').value,10);if(isNaN(n)||n<0)return toast(t('badnum'));S.students=n;save();render();toast(t('upd'))}
const FM=[['name','name'],['subj','subject'],['exp','experience'],['deg','degree'],['bio','bio'],['ach','achievements'],['phone','phone']];
function openForm(id){
  if(!isAdmin())return;editId=id||null;
  const x=id?S.teachers.find(y=>y.id===id):{name:'',subject:'',cat:0,experience:'',degree:'',bio:'',achievements:'',phone:''};
  $('f-title').textContent=t(id?'et':'at');
  $('f-cat').innerHTML=[0,1,2,3].map(c=>'<option value="'+c+'"'+(c===x.cat?' selected':'')+'>'+t('c'+c)+'</option>').join('');
  $('f-cat').classList.toggle('hidden',!!x.dir);
  FM.forEach(([f,k])=>$('f-'+f).value=tr(x[k]));
  $('f-img').value='';show('form',true);
}
function saveForm(){
  if(!isAdmin())return;
  const name=$('f-name').value.trim();if(!name)return toast(t('noname'));
  const x=editId?S.teachers.find(y=>y.id===editId):null;
  const keep=(k,v)=>x&&v===tr(x[k])?x[k]:v;
  const data={};FM.forEach(([f,k])=>data[k]=keep(k,$('f-'+f).value.trim()));
  const done=img=>{
    if(x){Object.assign(x,data);if(!x.dir)x.cat=+$('f-cat').value;if(img)x.img=img}
    else S.teachers.push(Object.assign({id:S.next++,cat:+$('f-cat').value,img:img||null},data));
    save();closeM('form');render();toast(t('saved'))};
  const f=$('f-img').files[0];
  if(f){const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);done(c.toDataURL('image/jpeg',.82))};im.onerror=()=>done(null);im.src=e.target.result};r.readAsDataURL(f)}else done(null);
}
applyLang();
